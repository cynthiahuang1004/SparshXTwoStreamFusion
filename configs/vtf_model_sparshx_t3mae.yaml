# SparshX MBT-fusion baseline in VisTacFusion model-config format (trained by
# vistacfusion.engine.train through model_type: external). Encoders / heads / tokens are
# copied from VisTacFusion/ablation/encoder/tac_t3_rgb_mae.yaml; only fusion_trunk differs.
model_type: external
external:
  import_path: sparshx_fusion.models.vtf_model:build_model
  sys_path:
  - /media/hdd2/ihsuan/SparshXTwoStreamFusion
image_size: 224
trunk_dim: 768
encoder:
  name: t3_large
  checkpoint: pretrained_encoders/t3_large
  embed_dim: 1024
  patch_size: 16
  frozen: true
  share_encoder_weights: false
  keep_cls: true
rgb_encoder:
  name: mae_vitl16
  checkpoint: pretrained_encoders/mae_vitl16.pth
  embed_dim: 1024
  patch_size: 16
projection:
  out_dim: 768
  modality_embedding: true
  rgb_positional_embedding: false
  tactile_positional_embedding: true
tokens:
  num_spatial_queries: 196
  num_pose_queries: 1
  object_embedding: true
  num_objects: 20
fusion_trunk:
  num_layers: 4
  num_bottleneck_tokens: 4
  num_heads: 8
  ffn_mult: 4
  dropout: 0.1
  tap_layers:
  - 0
  - 1
  - 2
  - 3
heads:
  dpt:
    features: 256
    dropout: 0.1
    out_depth_channels: 1
    out_normal_channels: 3
    output_frame: tactile
    encoder_tap_layers:
    - 2
    - 5
    - 8
    - 11
    inject_gate_init: 0.0
  pose:
    hidden_dim: 256
    dropout: 0.1
    pose_mode: regression
    rot_num_bins: 72
    use_spatial_pool: true
